<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DOOM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* — Upload Screen — */
#upload-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  height: 100dvh;
  padding: 20px;
  text-align: center;
}

#upload-screen h1 {
  font-size: 3rem;
  color: #c00;
  text-shadow: 0 0 20px rgba(200,0,0,0.5);
  margin-bottom: 8px;
  letter-spacing: 8px;
}

#upload-screen p {
  color: #888;
  margin-bottom: 30px;
  font-size: 0.9rem;
}

#drop-zone {
  width: 300px;
  max-width: 90vw;
  padding: 40px 20px;
  border: 2px dashed #444;
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

#drop-zone:hover, #drop-zone.dragover {
  border-color: #c00;
  background: rgba(200,0,0,0.05);
}

#drop-zone span {
  display: block;
  font-size: 1.1rem;
  color: #aaa;
}

#drop-zone small {
  display: block;
  margin-top: 8px;
  color: #555;
  font-size: 0.8rem;
}

#wad-input { display: none; }

#status {
  margin-top: 20px;
  color: #c00;
  min-height: 24px;
  font-size: 0.9rem;
}

/* — Loading bar — */
#loading {
  display: none;
  margin-top: 30px;
  width: 300px;
  max-width: 90vw;
}

#loading-bar-outer {
  width: 100%;
  height: 6px;
  background: #222;
  border-radius: 3px;
  overflow: hidden;
}

#loading-bar {
  width: 0%;
  height: 100%;
  background: #c00;
  transition: width 0.3s;
}

#loading-text {
  margin-top: 8px;
  color: #666;
  font-size: 0.8rem;
}

/* — Game Screen — */
#game-screen {
  display: none;
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

canvas#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* — Touch Controls Overlay — */
#touch-controls {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}

#touch-controls > * {
  pointer-events: auto;
}

/* Top bar */
#top-bar {
  position: absolute;
  top: 8px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  pointer-events: auto;
}

.top-btn {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.top-btn.active { background: rgba(200,0,0,0.4); }

#btn-menu {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 44px;
  font-size: 11px;
  letter-spacing: 1px;
}

/* D-Pad */
#dpad {
  position: absolute;
  bottom: 30px;
  left: 20px;
  width: 140px;
  height: 140px;
}

.dpad-btn {
  position: absolute;
  width: 46px;
  height: 46px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: rgba(255,255,255,0.6);
  -webkit-tap-highlight-color: transparent;
}

.dpad-btn.active {
  background: rgba(255,255,255,0.25);
}

#dpad-up    { top: 0;   left: 47px; }
#dpad-down  { bottom: 0; left: 47px; }
#dpad-left  { top: 47px; left: 0; }
#dpad-right { top: 47px; right: 0; }

/* Action buttons */
#action-buttons {
  position: absolute;
  bottom: 30px;
  right: 20px;
}

.action-btn {
  position: absolute;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  -webkit-tap-highlight-color: transparent;
}

.action-btn.active {
  filter: brightness(1.5);
}

#btn-fire {
  width: 80px; height: 80px;
  bottom: 0; right: 0;
  background: rgba(200, 0, 0, 0.35);
  border: 2px solid rgba(200, 0, 0, 0.5);
  color: rgba(255,255,255,0.8);
  font-size: 14px;
}

#btn-use {
  width: 60px; height: 60px;
  bottom: 90px; right: 10px;
  background: rgba(0, 100, 200, 0.3);
  border: 2px solid rgba(0, 100, 200, 0.45);
  color: rgba(255,255,255,0.7);
  font-size: 12px;
}

#btn-strafe-l {
  width: 50px; height: 50px;
  bottom: 50px; right: 90px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.5);
  font-size: 18px;
}

#btn-strafe-r {
  width: 50px; height: 50px;
  bottom: 50px; right: -50px;
  display: none; /* hidden — d-pad left/right handles turning */
}

/* Landscape prompt */
@media (orientation: portrait) {
  #rotate-prompt {
    display: flex !important;
  }
  #touch-controls { display: none !important; }
}

#rotate-prompt {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 1.1rem;
}

#rotate-prompt .icon {
  font-size: 3rem;
  margin-bottom: 16px;
}
</style>
</head>
<body>

<!-- Upload Screen -->
<div id="upload-screen">
  <h1>DOOM</h1>
  <p>Mobile Web Port</p>
  <div id="drop-zone">
    <span>Drop WAD file here</span>
    <small>or tap to browse (doom1.wad, doom.wad, doom2.wad)</small>
  </div>
  <input type="file" id="wad-input" accept=".wad">
  <div id="status"></div>
  <div id="loading">
    <div id="loading-bar-outer"><div id="loading-bar"></div></div>
    <div id="loading-text">Initializing DOOM engine...</div>
  </div>
  <div id="shareware-hint" style="margin-top:20px;color:#555;font-size:0.8rem;">
    Place <code style="color:#888">doom1.wad</code> next to this page for auto-start
  </div>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <canvas id="canvas" tabindex="0"></canvas>

  <!-- Rotate Prompt (portrait) -->
  <div id="rotate-prompt">
    <div class="icon">&#x1F504;</div>
    <div>Rotate device to landscape</div>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <!-- Top bar: weapon select + menu -->
    <div id="top-bar">
      <div class="top-btn" data-key="49">1</div>
      <div class="top-btn" data-key="50">2</div>
      <div class="top-btn" data-key="51">3</div>
      <div class="top-btn" data-key="52">4</div>
      <div class="top-btn" data-key="53">5</div>
      <div class="top-btn" data-key="54">6</div>
      <div class="top-btn" data-key="55">7</div>
    </div>
    <div class="top-btn" id="btn-menu" data-key="27">ESC</div>

    <!-- D-Pad -->
    <div id="dpad">
      <div class="dpad-btn" id="dpad-up"    data-key="173">&#x25B2;</div>
      <div class="dpad-btn" id="dpad-down"  data-key="175">&#x25BC;</div>
      <div class="dpad-btn" id="dpad-left"  data-key="172">&#x25C0;</div>
      <div class="dpad-btn" id="dpad-right" data-key="174">&#x25B6;</div>
    </div>

    <!-- Action buttons -->
    <div id="action-buttons">
      <div class="action-btn" id="btn-fire" data-key="157">FIRE</div>
      <div class="action-btn" id="btn-use"  data-key="32">USE</div>
      <div class="action-btn" id="btn-strafe-l" data-key="44">,</div>
    </div>
  </div>
</div>

<script>
// DOOM key constants (must match doomdef.h)
var KEY = {
  RIGHTARROW: 0xae,
  LEFTARROW:  0xac,
  UPARROW:    0xad,
  DOWNARROW:  0xaf,
  ESCAPE:     27,
  ENTER:      13,
  RCTRL:      0x80+0x1d,  // fire
  SPACE:      32,          // use
  RSHIFT:     0x80+0x36,  // run
  RALT:       0x80+0x38,  // strafe
  COMMA:      44           // strafe left
};

// ─── WAD Upload ───
var dropZone = document.getElementById('drop-zone');
var wadInput = document.getElementById('wad-input');
var statusEl = document.getElementById('status');
var hintEl = document.getElementById('shareware-hint');

dropZone.addEventListener('click', function() { wadInput.click(); });

dropZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', function() {
  dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) loadWAD(e.dataTransfer.files[0]);
});

wadInput.addEventListener('change', function() {
  if (wadInput.files.length > 0) loadWAD(wadInput.files[0]);
});

function loadWAD(file) {
  var name = file.name.toLowerCase();
  if (!name.endsWith('.wad')) {
    statusEl.textContent = 'Please select a .wad file';
    return;
  }

  statusEl.textContent = 'Reading ' + file.name + '...';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading-bar').style.width = '20%';
  hintEl.style.display = 'none';

  var reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('loading-bar').style.width = '50%';
    document.getElementById('loading-text').textContent = 'Starting DOOM engine...';
    window.wadData = new Uint8Array(e.target.result);
    window.wadFileName = name;
    startDoom();
  };
  reader.onerror = function() {
    statusEl.textContent = 'Error reading file. Try again.';
  };
  reader.readAsArrayBuffer(file);
}

// ─── Auto-fetch shareware WAD ───
function tryFetchSharewareWAD() {
  statusEl.textContent = 'Looking for shareware WAD...';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading-bar').style.width = '10%';

  fetch('doom1.wad').then(function(resp) {
    if (!resp.ok) throw new Error('not found');
    var total = parseInt(resp.headers.get('content-length') || '0', 10);
    var reader = resp.body.getReader();
    var chunks = [];
    var loaded = 0;

    function read() {
      return reader.read().then(function(result) {
        if (result.done) {
          var data = new Uint8Array(loaded);
          var offset = 0;
          for (var i = 0; i < chunks.length; i++) {
            data.set(chunks[i], offset);
            offset += chunks[i].length;
          }
          // Verify it looks like a WAD file
          if (loaded > 4 && String.fromCharCode(data[0],data[1],data[2],data[3]) === 'IWAD') {
            document.getElementById('loading-bar').style.width = '50%';
            document.getElementById('loading-text').textContent = 'Starting DOOM engine...';
            window.wadData = data;
            window.wadFileName = 'doom1.wad';
            hintEl.style.display = 'none';
            startDoom();
          } else {
            throw new Error('invalid WAD');
          }
          return;
        }
        chunks.push(result.value);
        loaded += result.value.length;
        if (total > 0) {
          var pct = Math.min(40, Math.round((loaded / total) * 40)) + 10;
          document.getElementById('loading-bar').style.width = pct + '%';
        }
        document.getElementById('loading-text').textContent =
          'Downloading doom1.wad... ' + (loaded / 1024 | 0) + ' KB';
        return read();
      });
    }
    return read();
  }).catch(function() {
    // No bundled WAD — show upload UI
    statusEl.textContent = '';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('loading-bar').style.width = '0%';
  });
}

// Try auto-fetch when the page loads
tryFetchSharewareWAD();

// ─── Emscripten Module ───
var runtimeReady = false;

var Module = {
  preRun: [],
  postRun: [],
  canvas: document.getElementById('canvas'),
  noInitialRun: true,

  print: function(text) { console.log(text); },
  printErr: function(text) { console.error(text); },

  setStatus: function(text) {
    if (text) {
      document.getElementById('loading-text').textContent = text;
    }
  },

  onRuntimeInitialized: function() {
    runtimeReady = true;
    console.log('Emscripten runtime ready');
    // If WAD was already loaded (e.g. from auto-fetch), start now
    if (window.wadData) {
      startDoom();
    }
  }
};

function startDoom() {
  if (!window.wadData) return;

  if (!runtimeReady) {
    // WASM not loaded yet — will be called from onRuntimeInitialized
    document.getElementById('loading-text').textContent = 'Waiting for DOOM engine...';
    return;
  }

  // Write WAD directly to Emscripten virtual filesystem (FS is already initialized)
  var dir = '/';
  FS.writeFile(dir + window.wadFileName, window.wadData);

  // Set environment variables
  ENV['HOME'] = '/home/web_user';
  ENV['DOOMWADDIR'] = dir;

  // Create home directory for config
  try { FS.mkdir('/home'); } catch(e) {}
  try { FS.mkdir('/home/web_user'); } catch(e) {}

  document.getElementById('loading-bar').style.width = '90%';
  document.getElementById('loading-text').textContent = 'Launching DOOM...';

  // Switch to game screen
  setTimeout(function() {
    document.getElementById('loading-bar').style.width = '100%';
    document.getElementById('upload-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    if (isTouchDevice()) {
      document.getElementById('touch-controls').style.display = 'block';
    }
    document.getElementById('canvas').focus();

    // Start the game
    Module.callMain(['-window']);
  }, 200);
}

// ─── Touch Controls ───
function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function setupTouchControls() {
  var buttons = document.querySelectorAll('[data-key]');

  buttons.forEach(function(btn) {
    var key = parseInt(btn.getAttribute('data-key'));

    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      btn.classList.add('active');
      if (Module._doom_key_down) Module._doom_key_down(key);
    }, { passive: false });

    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      btn.classList.remove('active');
      if (Module._doom_key_up) Module._doom_key_up(key);
    }, { passive: false });

    btn.addEventListener('touchcancel', function(e) {
      btn.classList.remove('active');
      if (Module._doom_key_up) Module._doom_key_up(key);
    });

    // Also support mouse for testing on desktop
    btn.addEventListener('mousedown', function(e) {
      e.preventDefault();
      btn.classList.add('active');
      if (Module._doom_key_down) Module._doom_key_down(key);
    });

    btn.addEventListener('mouseup', function(e) {
      btn.classList.remove('active');
      if (Module._doom_key_up) Module._doom_key_up(key);
    });

    btn.addEventListener('mouseleave', function(e) {
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        if (Module._doom_key_up) Module._doom_key_up(key);
      }
    });
  });

  // Enter key for menu confirmation on touch
  var canvas = document.getElementById('canvas');
  canvas.addEventListener('touchstart', function(e) {
    // Single tap on canvas = Enter (for menus)
    if (e.touches.length === 1) {
      var touch = e.touches[0];
      var rect = canvas.getBoundingClientRect();
      var x = (touch.clientX - rect.left) / rect.width;
      var y = (touch.clientY - rect.top) / rect.height;

      // Only if tap is in the center area (not near controls)
      if (x > 0.25 && x < 0.75 && y > 0.1 && y < 0.7) {
        if (Module._doom_key_down) {
          Module._doom_key_down(13); // KEY_ENTER
          setTimeout(function() {
            if (Module._doom_key_up) Module._doom_key_up(13);
          }, 100);
        }
      }
    }
  }, { passive: false });
}

// Initialize touch controls when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupTouchControls);
} else {
  setupTouchControls();
}

// Prevent default touch behaviors
document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

// Fullscreen on orientation change
if (screen.orientation) {
  screen.orientation.addEventListener('change', function() {
    if (document.getElementById('game-screen').style.display !== 'none') {
      document.getElementById('canvas').focus();
    }
  });
}
</script>

{{{ SCRIPT }}}

</body>
</html>
